name: CPU CI (Compile & Lint)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-cuda-cpu:
    name: Compile CUDA (No Execution)
    runs-on: ubuntu-latest
    
    # Use a container that has the CUDA Toolkit pre-installed so we have `nvcc`
    container: nvidia/cuda:12.2.0-devel-ubuntu22.04

    steps:
    - name: Install dependencies
      run: |
        apt-get update && apt-get install -y cmake git python3 python3-pip
        
    # GitHub Actions needs this when running in a container
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake ..

    - name: Build C/CUDA Project
      run: |
        cd build
        make -j

    # We CANNOT run the compiled binaries here (e.g. ./test_physics) because 
    # the GitHub Ubuntu runner doesn't have a physical GPU. But if `make` succeeds, 
    # we know the CUDA code is structurally sound and syntax-error free!

  lint-python:
    name: Python Linting
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install flake8
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 python/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 python/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
