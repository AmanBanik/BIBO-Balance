<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1464a0"/>
    </marker>
    <style>
      .title { font: 700 22px sans-serif; fill:#111; }
      .label { font: 16px sans-serif; fill:#111; }
      .small { font: 13px sans-serif; fill:#444; }
      .axis { stroke:#111; stroke-width:2; marker-end:url(#arrow); }
      .vec { stroke:#1464a0; stroke-width:4; marker-end:url(#arrowBlue); }
      .plane { fill:#e9eef3; stroke:#111; stroke-width:2; opacity:.9; }
      .ghost { fill:none; stroke:#888; stroke-width:2; stroke-dasharray:7 6; }
      .rod { stroke:#333; stroke-width:8; }
      .point { fill:#111; }
      .ball { fill:#fff; stroke:#111; stroke-width:3; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="820" fill="#fff"/>

  <!-- Panel 1 -->
  <g transform="translate(30,25)">
    <rect x="0" y="0" width="640" height="365" rx="14" fill="#fafafa" stroke="#bbb"/>
    <text x="25" y="38" class="title">A. World frame and gravity vector</text>

    <polygon class="plane" points="150,270 500,270 555,205 205,205"/>
    <circle cx="350" cy="235" r="14" class="ball"/>
    <line x1="350" y1="235" x2="350" y2="105" class="vec"/>
    <text x="365" y="112" class="label">g</text>

    <line x1="350" y1="235" x2="520" y2="235" class="axis"/>
    <line x1="350" y1="235" x2="255" y2="180" class="axis"/>
    <line x1="350" y1="235" x2="350" y2="90" class="axis"/>
    <text x="525" y="240" class="label">x</text>
    <text x="242" y="176" class="label">y</text>
    <text x="355" y="85" class="label">z</text>

    <path d="M350 190 A45 45 0 0 1 390 215" fill="none" stroke="#111" stroke-width="2"/>
    <text x="398" y="205" class="label">φ</text>
    <text x="360" y="178" class="small">inclination</text>
    <text x="455" y="176" class="small">θ = azimuth</text>
  </g>

  <!-- Panel 2 -->
  <g transform="translate(710,25)">
    <rect x="0" y="0" width="660" height="365" rx="14" fill="#fafafa" stroke="#bbb"/>
    <text x="25" y="38" class="title">B. Platform roll: gravity projected onto plane</text>

    <polygon class="plane" points="160,285 495,230 550,165 215,220"/>
    <circle cx="345" cy="224" r="14" class="ball"/>

    <line x1="345" y1="224" x2="305" y2="95" class="vec"/>
    <text x="292" y="95" class="label">g</text>

    <line x1="345" y1="224" x2="400" y2="255" class="vec"/>
    <text x="408" y="260" class="label">g∥</text>

    <line x1="345" y1="224" x2="430" y2="160" class="ghost"/>
    <line x1="345" y1="224" x2="430" y2="160" class="vec"/>
    <text x="438" y="155" class="label">n</text>

    <path d="M345 195 A34 34 0 0 1 371 209" fill="none" stroke="#111" stroke-width="2"/>
    <text x="375" y="198" class="label">α</text>

    <text x="35" y="330" class="small">g∥ = g − (g·n)n</text>
    <text x="285" y="330" class="small">n = platform unit normal</text>
  </g>

  <!-- Panel 3 -->
  <g transform="translate(30,420)">
    <rect x="0" y="0" width="640" height="365" rx="14" fill="#fafafa" stroke="#bbb"/>
    <text x="25" y="38" class="title">C. Platform pitch / corner-height geometry</text>

    <!-- Base anchors -->
    <circle cx="145" cy="265" r="6" class="point"/>
    <circle cx="505" cy="265" r="6" class="point"/>
    <text x="120" y="295" class="small">B₁</text>
    <text x="500" y="295" class="small">B₂</text>

    <!-- Platform corners -->
    <circle cx="190" cy="195" r="6" class="point"/>
    <circle cx="480" cy="145" r="6" class="point"/>
    <line x1="190" y1="195" x2="480" y2="145" class="ghost"/>
    <line x1="190" y1="195" x2="145" y2="265" class="rod"/>
    <line x1="480" y1="145" x2="505" y2="265" class="rod"/>
    <text x="168" y="182" class="small">P₁</text>
    <text x="484" y="138" class="small">P₂</text>

    <!-- normal -->
    <line x1="335" y1="170" x2="350" y2="70" class="vec"/>
    <text x="357" y="69" class="label">n</text>

    <!-- z -->
    <line x1="120" y1="265" x2="120" y2="130" class="axis"/>
    <text x="126" y="128" class="label">z</text>

    <text x="35" y="335" class="small">Rigid planar surface: pose is derived from its corner geometry.</text>
    <text x="35" y="352" class="small">Actuator lengths Li constrain the platform configuration.</text>
  </g>

  <!-- Panel 4 -->
  <g transform="translate(710,420)">
    <rect x="0" y="0" width="660" height="365" rx="14" fill="#fafafa" stroke="#bbb"/>
    <text x="25" y="38" class="title">D. Ball rolling and stabilization variables</text>

    <polygon class="plane" points="135,270 490,225 535,170 180,215"/>
    <circle cx="335" cy="220" r="14" class="ball"/>
    <line x1="335" y1="220" x2="395" y2="235" class="vec"/>
    <text x="405" y="240" class="label">v</text>

    <line x1="335" y1="220" x2="280" y2="100" class="vec"/>
    <text x="264" y="98" class="label">g</text>

    <path d="M340 250 C365 265, 398 270, 432 260" fill="none" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="405" y="290" class="label">trajectory</text>

    <line x1="190" y1="215" x2="150" y2="300" class="rod"/>
    <line x1="490" y1="175" x2="510" y2="300" class="rod"/>
    <line x1="180" y1="215" x2="490" y2="175" class="ghost"/>

    <text x="35" y="330" class="small">Observe: ball motion, elevation, rod-length states, camera views.</text>
    <text x="35" y="350" class="small">Act: ΔL₁, ΔL₂, ΔL₃, ΔL₄. Final equilibrium emerges from the dynamics.</text>
  </g>
</svg>